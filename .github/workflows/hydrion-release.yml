name: Hydrion Release Candidate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hydrion-release-candidate-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.44.8"
  JAVA_VERSION: "17"

jobs:
  validate-source:
    name: Validate release source
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Record job-start capacity
        run: timeout 1m bash tool/ci_disk_diagnostics.sh "validation job start"

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: false
          pub-cache: true

      - name: Record post-toolchain and cache capacity
        run: timeout 1m bash tool/ci_disk_diagnostics.sh "after Flutter setup and pub-cache restore"

      - name: Resolve dependencies
        run: flutter pub get

      - name: Record post-dependency capacity
        run: timeout 1m bash tool/ci_disk_diagnostics.sh "after dependency resolution"

      - name: Validate source
        run: |
          dart run tool/validate_ci_workflows.dart
          dart format --output=none --set-exit-if-changed .
          flutter analyze
          flutter test
          dart run tool/secret_scan.dart

      - name: Record post-test capacity
        run: timeout 1m bash tool/ci_disk_diagnostics.sh "after tests"

      - name: Record validation failure capacity
        if: always()
        run: timeout 1m bash tool/ci_disk_diagnostics.sh "validation job final state"

  release-candidate:
    name: Build protected artifacts
    runs-on: ubuntu-latest
    needs: validate-source
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Record job-start capacity
        run: timeout 1m bash tool/ci_disk_diagnostics.sh "release job start"

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: false
          pub-cache: false

      - name: Record post-toolchain and cache capacity
        run: timeout 1m bash tool/ci_disk_diagnostics.sh "after Flutter setup and pub-cache restore"

      - name: Require complete production signing configuration
        env:
          KEYSTORE: ${{ secrets.HYDRION_ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.HYDRION_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.HYDRION_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.HYDRION_ANDROID_KEY_PASSWORD }}
          SIGNING_CERT_SHA256: ${{ secrets.HYDRION_ANDROID_SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/main" || {
            echo "Release candidates must be built from main."
            exit 1
          }
          for value in "$KEYSTORE" "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" "$SIGNING_CERT_SHA256"; do
            test -n "$value" || { echo "Production signing configuration is incomplete."; exit 1; }
          done
          echo "::add-mask::$STORE_PASSWORD"
          echo "::add-mask::$KEY_ALIAS"
          echo "::add-mask::$KEY_PASSWORD"
          printf '%s' "$KEYSTORE" | base64 --decode > android/hydrion-release.jks
          cat > android/key.properties <<EOF
          storeFile=../hydrion-release.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF



          # Exercise private-key decryption now instead of discovering a bad
          # key password after the full test suite and Android compilation.
          probe_dir="$(mktemp -d)"
          trap 'rm -rf "$probe_dir"' EXIT
          printf 'Hydrion signing probe\n' > "$probe_dir/probe.txt"
          jar --create --file "$probe_dir/probe.jar" \
            -C "$probe_dir" probe.txt
          if ! jarsigner \
            -keystore android/hydrion-release.jks \
            -storepass "$STORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            "$probe_dir/probe.jar" "$KEY_ALIAS" >/dev/null; then
            echo "::error::Android signing credentials could not decrypt the configured private key. Verify HYDRION_ANDROID_KEY_ALIAS and HYDRION_ANDROID_KEY_PASSWORD. For PKCS12 keystores, the key password normally matches HYDRION_ANDROID_KEYSTORE_PASSWORD."
            exit 1
          fi
          bash tool/verify_jar_signature.sh "$probe_dir/probe.jar"

      - name: Resolve dependencies
        run: flutter pub get

      - name: Record post-dependency capacity
        run: timeout 1m bash tool/ci_disk_diagnostics.sh "after dependency resolution"

      - name: Reclaim validation output and require Android build capacity
        run: |
          set -euo pipefail
          workspace="$(realpath "$GITHUB_WORKSPACE")"
          [[ "$workspace" == /home/runner/work/* ]] || {
            echo "::error::Refusing cleanup outside the hosted-runner workspace."
            exit 1
          }
          for relative in build/test_cache build/unit_test_assets coverage android/.gradle; do
            target="$(realpath -m "$workspace/$relative")"
            [[ "$target" == "$workspace/"* ]] || {
              echo "::error::Unsafe cleanup path: $target"
              exit 1
            }
            rm -rf -- "$target"
          done
          available_kb="$(df --output=avail / | tail -n 1 | tr -d ' ')"
          available_inodes="$(df --output=iavail / | tail -n 1 | tr -d ' ')"
          # Temporary conservative gate until a successful hosted release run
          # records Hydrion's actual peak free-space requirement.
          minimum_kb=$((10 * 1024 * 1024))
          minimum_inodes=500000
          if (( available_kb < minimum_kb )); then
            echo "::error::Android release build requires at least 10 GiB free; only $((available_kb / 1024)) MiB is available."
            exit 1
          fi
          if (( available_inodes < minimum_inodes )); then
            echo "::error::Android release build temporarily requires at least 500000 free inodes; only ${available_inodes} are available."
            exit 1
          fi

      - name: Build Android release APK
        run: bash tool/ci_run_android_build.sh release

      - name: Build Android release app bundle
        run: bash tool/ci_run_android_build.sh appbundle

      - name: Build Web release
        run: flutter build web --release

      - name: Record post-build capacity
        run: timeout 1m bash tool/ci_disk_diagnostics.sh "after candidate builds"

      - name: Validate and stage the exact distributable artifacts
        env:
          SIGNING_CERT_SHA256: ${{ secrets.HYDRION_ANDROID_SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          version="$(sed -n 's/^version: \([^+]*\)+\(.*\)$/\1/p' pubspec.yaml)"
          build="$(sed -n 's/^version: \([^+]*\)+\(.*\)$/\2/p' pubspec.yaml)"
          test -n "$version" && test -n "$build"

          dart run tool/validate_android_release.dart \
            --apk build/app/outputs/flutter-apk/app-release.apk \
            --output-dir release-artifacts \
            --signing-kind production \
            --expected-certificate-sha256 "$SIGNING_CERT_SHA256" \
            --git-sha "$GITHUB_SHA"

          flutter pub deps --json > release-artifacts/flutter-pub-dependencies.json

          aab="release-artifacts/hydrion-${version}-${build}-android-production-release.aab"
          cp build/app/outputs/bundle/release/app-release.aab "$aab"
          bash tool/verify_jar_signature.sh "$aab"

          web="release-artifacts/hydrion-${version}-${build}-web-release.tar.gz"
          tar -C build/web -czf "$web" .
          sha256sum "$aab" "$web" > release-artifacts/SHA256SUMS.txt
          cat release-artifacts/*.apk.sha256 >> release-artifacts/SHA256SUMS.txt
          {
            flutter --version
            dart --version
            java -version
            git rev-parse HEAD
            grep '^version:' pubspec.yaml
          } > release-artifacts/TOOLCHAIN_AND_SOURCE.txt 2>&1
          python3 - "$version" "$build" "$GITHUB_SHA" <<'PY'
          import hashlib, json, pathlib, sys
          _, version, build, git_sha = sys.argv
          root = pathlib.Path("release-artifacts")
          artifacts = []
          for candidate in sorted(root.iterdir()):
              if not (candidate.name.endswith(".apk") or
                      candidate.name.endswith(".aab") or
                      candidate.name.endswith(".tar.gz")):
                  continue
              artifacts.append({
                  "name": candidate.name,
                  "size_bytes": candidate.stat().st_size,
                  "sha256": hashlib.sha256(candidate.read_bytes()).hexdigest(),
              })
          manifest = {
              "product": "Hydrion",
              "version": version,
              "build": int(build),
              "git_sha": git_sha,
              "release_state": "candidate-not-published",
              "artifacts": artifacts,
          }
          (root / "release-manifest.json").write_text(
              json.dumps(manifest, indent=2) + "\n", encoding="utf-8"
          )
          PY

      - name: Upload candidate artifacts without publishing
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hydrion-release-candidate-${{ github.run_number }}-${{ github.run_attempt }}
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Upload Android build diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hydrion-release-android-diagnostics-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            ci-artifacts/android-release/
            ci-artifacts/android-appbundle/
          if-no-files-found: warn
          retention-days: 14

      - name: Record release failure capacity
        if: always()
        run: timeout 1m bash tool/ci_disk_diagnostics.sh "release job final state"
