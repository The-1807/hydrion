name: Hydrion Flutter CI

on:
  push:
    branches:
      - main
      - develop
      - apk-stabilization
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      scope:
        description: Validation scope (Apple includes the quality gate)
        type: choice
        options:
          - full
          - apple
        default: full

permissions:
  contents: read

concurrency:
  group: hydrion-flutter-ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

env:
  FLUTTER_VERSION: "3.44.8"
  JAVA_VERSION: "17"
  CI_ARTIFACTS_DIRECTORY: "ci-artifacts"

jobs:
  quality-gate:
    name: Analyze, Test, and Audit
    runs-on: ubuntu-latest
    timeout-minutes: 45

    defaults:
      run:
        shell: bash
        working-directory: .

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: false
          pub-cache: ${{ github.event_name != 'pull_request' }}

      - name: Create CI artifact directory
        run: mkdir -p "${CI_ARTIFACTS_DIRECTORY}"

      - name: Record environment information
        run: |
          {
            echo "Hydrion CI environment"
            echo "======================"
            echo
            echo "Repository: ${{ github.repository }}"
            echo "Event: ${{ github.event_name }}"
            echo "Ref: ${{ github.ref }}"
            echo "Commit: ${{ github.sha }}"
            echo "Runner OS: ${{ runner.os }}"
            echo "Runner architecture: ${{ runner.arch }}"
            echo
            echo "Flutter:"
            flutter --version
            echo
            echo "Dart:"
            dart --version
            echo
            echo "Java:"
            java -version
            echo
            echo "Git:"
            git --version
          } 2>&1 | tee "${CI_ARTIFACTS_DIRECTORY}/environment.txt"

      - name: Validate Flutter project root
        run: |
          set -euo pipefail

          test -f pubspec.yaml || {
            echo "pubspec.yaml was not found at the repository root."
            exit 1
          }

          test -d lib || {
            echo "The lib directory was not found at the repository root."
            exit 1
          }

          test -d test || {
            echo "The test directory was not found at the repository root."
            exit 1
          }

      - name: Get dependencies
        run: |
          set -o pipefail
          flutter pub get 2>&1 |
            tee "${CI_ARTIFACTS_DIRECTORY}/flutter-pub-get.log"

      - name: Validate CI workflow cache and action policy
        run: dart run tool/validate_ci_workflows.dart

      - name: Record dependency state
        run: |
          set -o pipefail
          flutter pub deps 2>&1 |
            tee "${CI_ARTIFACTS_DIRECTORY}/flutter-pub-deps.log"

      - name: Check outdated dependencies
        id: outdated
        continue-on-error: true
        run: |
          set +e
          set -o pipefail

          flutter pub outdated 2>&1 |
            tee "${CI_ARTIFACTS_DIRECTORY}/flutter-pub-outdated.log"

          exit_code=${PIPESTATUS[0]}
          echo "exit_code=${exit_code}" >> "${GITHUB_OUTPUT}"
          exit "${exit_code}"

      - name: Run secret hygiene scan
        id: secret_scan
        continue-on-error: true
        run: |
          set +e
          set -o pipefail

          timeout 10m dart run tool/secret_scan.dart 2>&1 |
            tee "${CI_ARTIFACTS_DIRECTORY}/secret-scan.log"

          exit_code=${PIPESTATUS[0]}
          echo "exit_code=${exit_code}" >> "${GITHUB_OUTPUT}"
          exit "${exit_code}"

      - name: Verify Dart formatting
        id: format
        continue-on-error: true
        run: |
          set +e
          set -o pipefail

          dart format --set-exit-if-changed . 2>&1 |
            tee "${CI_ARTIFACTS_DIRECTORY}/dart-format.log"

          exit_code=${PIPESTATUS[0]}
          echo "exit_code=${exit_code}" >> "${GITHUB_OUTPUT}"
          exit "${exit_code}"

      - name: Run Flutter analyzer
        id: analyze
        continue-on-error: true
        run: |
          set +e
          set -o pipefail

          timeout 15m flutter analyze 2>&1 |
            tee "${CI_ARTIFACTS_DIRECTORY}/flutter-analyze.log"

          exit_code=${PIPESTATUS[0]}
          echo "exit_code=${exit_code}" >> "${GITHUB_OUTPUT}"
          exit "${exit_code}"

      - name: Test CI test-report classifier
        run: python3 -W error::SyntaxWarning -m unittest discover -s tool/tests -p 'test_ci_test_report.py'

      - name: Run production literal audit
        id: literal_audit
        continue-on-error: true
        run: |
          set +e
          set -o pipefail

          timeout 10m dart run tool/production_string_audit.dart --summary 2>&1 |
            tee "${CI_ARTIFACTS_DIRECTORY}/production-string-audit.log"

          exit_code=${PIPESTATUS[0]}
          echo "exit_code=${exit_code}" >> "${GITHUB_OUTPUT}"
          exit "${exit_code}"

      - name: Run complete Flutter test suite
        id: tests
        continue-on-error: true
        run: |
          set +e

          # A fresh random ordering seed per run exposes order-dependent tests;
          # it is logged and recorded so any failure can be replayed locally.
          seed="$(od -An -N4 -tu4 /dev/urandom | tr -d ' ')"
          echo "seed=${seed}" >> "${GITHUB_OUTPUT}"
          echo "${seed}" > "${CI_ARTIFACTS_DIRECTORY}/flutter-test-seed.txt"
          echo "Flutter test random ordering seed: ${seed}"
          echo "Replay: flutter test --test-randomize-ordering-seed ${seed}"

          timeout 30m flutter test \
            --no-pub \
            --coverage \
            --machine \
            --timeout 2m \
            --test-randomize-ordering-seed "${seed}" \
            > "${CI_ARTIFACTS_DIRECTORY}/flutter-test-machine.jsonl" \
            2> "${CI_ARTIFACTS_DIRECTORY}/flutter-test-stderr.log"

          exit_code=$?
          echo "exit_code=${exit_code}" >> "${GITHUB_OUTPUT}"
          exit "${exit_code}"

      - name: Generate complete Flutter test report
        id: test_report
        if: always()
        continue-on-error: true
        env:
          TEST_EXIT_CODE: ${{ steps.tests.outputs.exit_code }}
          TEST_SEED: ${{ steps.tests.outputs.seed }}
        run: |
          set +e

          # Classifies PASS/FAIL/TIMEOUT/INCOMPLETE from the raw events and the
          # exit code independently (docs/architecture/REMEDIATION_ACCEPTANCE.md).
          python3 tool/ci_test_report.py \
            --machine "${CI_ARTIFACTS_DIRECTORY}/flutter-test-machine.jsonl" \
            --stderr "${CI_ARTIFACTS_DIRECTORY}/flutter-test-stderr.log" \
            --exit-code "${TEST_EXIT_CODE:-not-run}" \
            --seed "${TEST_SEED:-not-recorded}" \
            --report "${CI_ARTIFACTS_DIRECTORY}/BUG_REPORT.md" \
            --readable "${CI_ARTIFACTS_DIRECTORY}/flutter-test-readable.log" \
            --json "${CI_ARTIFACTS_DIRECTORY}/flutter-test-summary.json"

          exit_code=$?
          echo "exit_code=${exit_code}" >> "${GITHUB_OUTPUT}"
          exit "${exit_code}"

      - name: Generate CI quality summary
        if: always()
        env:
          SECRET_EXIT: ${{ steps.secret_scan.outputs.exit_code }}
          FORMAT_EXIT: ${{ steps.format.outputs.exit_code }}
          ANALYZE_EXIT: ${{ steps.analyze.outputs.exit_code }}
          TEST_EXIT: ${{ steps.tests.outputs.exit_code }}
          TEST_RESULT: ${{ steps.test_report.outputs.result }}
          TEST_SEED: ${{ steps.tests.outputs.seed }}
          LITERAL_EXIT: ${{ steps.literal_audit.outputs.exit_code }}
          OUTDATED_EXIT: ${{ steps.outdated.outputs.exit_code }}
          REPORT_EXIT: ${{ steps.test_report.outputs.exit_code }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          artifacts = Path(os.environ["CI_ARTIFACTS_DIRECTORY"])
          summary_path = artifacts / "CI_SUMMARY.md"

          checks = [
              ("Secret hygiene scan", os.environ.get("SECRET_EXIT") or "not-run", True),
              ("Dart format", os.environ.get("FORMAT_EXIT") or "not-run", True),
              ("Flutter analyze", os.environ.get("ANALYZE_EXIT") or "not-run", True),
              ("Flutter tests", os.environ.get("TEST_EXIT") or "not-run", True),
              ("Flutter test report (PASS required)", os.environ.get("REPORT_EXIT") or "not-run", True),
              ("Production literal audit", os.environ.get("LITERAL_EXIT") or "not-run", True),
              ("Dependency audit", os.environ.get("OUTDATED_EXIT") or "not-run", False),
          ]

          with summary_path.open("w", encoding="utf-8") as summary:
              summary.write("# Hydrion CI Audit\n\n")
              summary.write("| Check | Exit code | Result | Gate |\n")
              summary.write("|---|---:|---|---|\n")

              for name, exit_code, blocking in checks:
                  result = "Passed" if exit_code == "0" else "Failed or not completed"
                  gate = "Blocking" if blocking else "Diagnostic"
                  summary.write(
                      f"| {name} | `{exit_code}` | {result} | {gate} |\n"
                  )

              summary.write("\n")
              summary.write(
                  f"Flutter test result: "
                  f"**{os.environ.get('TEST_RESULT') or 'NOT_RUN'}** "
                  f"(random ordering seed `{os.environ.get('TEST_SEED') or 'not recorded'}`)\n\n"
              )
              summary.write(
                  f"Workflow run: {os.environ.get('GITHUB_SERVER_URL')}/"
                  f"{os.environ.get('GITHUB_REPOSITORY')}/actions/runs/"
                  f"{os.environ.get('GITHUB_RUN_ID')}\n"
              )

          print(f"Generated {summary_path}.")
          PY

      - name: Publish CI job summary
        if: always()
        run: |
          if [[ -f "${CI_ARTIFACTS_DIRECTORY}/CI_SUMMARY.md" ]]; then
            cat "${CI_ARTIFACTS_DIRECTORY}/CI_SUMMARY.md" >> "${GITHUB_STEP_SUMMARY}"
          fi

          if [[ -f "${CI_ARTIFACTS_DIRECTORY}/BUG_REPORT.md" ]]; then
            echo >> "${GITHUB_STEP_SUMMARY}"
            cat "${CI_ARTIFACTS_DIRECTORY}/BUG_REPORT.md" >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Upload CI audit artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hydrion-ci-audit-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            ci-artifacts/
            coverage/lcov.info
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce quality gate
        if: always()
        env:
          SECRET_EXIT: ${{ steps.secret_scan.outputs.exit_code }}
          FORMAT_EXIT: ${{ steps.format.outputs.exit_code }}
          ANALYZE_EXIT: ${{ steps.analyze.outputs.exit_code }}
          TEST_EXIT: ${{ steps.tests.outputs.exit_code }}
          TEST_RESULT: ${{ steps.test_report.outputs.result }}
          LITERAL_EXIT: ${{ steps.literal_audit.outputs.exit_code }}
        run: |
          secret_exit="${SECRET_EXIT:-1}"
          format_exit="${FORMAT_EXIT:-1}"
          analyze_exit="${ANALYZE_EXIT:-1}"
          test_exit="${TEST_EXIT:-1}"
          test_result="${TEST_RESULT:-NOT_RUN}"
          literal_exit="${LITERAL_EXIT:-1}"

          failed=0

          if [[ "${secret_exit}" != "0" ]]; then
            echo "::error::Secret hygiene scan failed with exit code ${secret_exit}."
            failed=1
          fi

          if [[ "${format_exit}" != "0" ]]; then
            echo "::error::Dart formatting failed with exit code ${format_exit}."
            failed=1
          fi

          if [[ "${analyze_exit}" != "0" ]]; then
            echo "::error::Flutter analyze failed with exit code ${analyze_exit}."
            failed=1
          fi

          if [[ "${test_exit}" != "0" ]]; then
            echo "::error::Flutter tests failed with exit code ${test_exit}."
            failed=1
          fi

          # TIMEOUT, INCOMPLETE and contradictory reports are never PASS.
          if [[ "${test_result}" != "PASS" ]]; then
            echo "::error::Flutter test report classified the run as ${test_result}."
            failed=1
          fi

          if [[ "${literal_exit}" != "0" ]]; then
            echo "::error::Production literal audit failed with exit code ${literal_exit}."
            failed=1
          fi

          if [[ "${failed}" -ne 0 ]]; then
            echo "Hydrion quality gate failed. Download the CI audit artifact and review BUG_REPORT.md."
            exit 1
          fi

          echo "Hydrion quality gate passed."

  build-android-debug:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.scope != 'apple' }}
    name: Build Android debug smoke APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: quality-gate

    defaults:
      run:
        shell: bash
        working-directory: .

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: false
          pub-cache: false

      - name: Get dependencies
        run: flutter pub get

      - name: Build debug APK for device smoke installs
        run: bash tool/ci_run_android_build.sh debug

      - name: Upload debug Android APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hydrion-android-debug-apk-${{ github.run_number }}-${{ github.run_attempt }}
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload debug-build diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hydrion-android-debug-diagnostics-${{ github.run_number }}-${{ github.run_attempt }}
          path: ${{ env.CI_ARTIFACTS_DIRECTORY }}/android-debug/
          if-no-files-found: warn
          retention-days: 14

      - name: Record debug-job final state
        if: always()
        run: timeout 2m bash tool/ci_disk_diagnostics.sh "Android debug job final state"

  build-android-release:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.scope != 'apple' }}
    name: Build Android signed release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: quality-gate

    defaults:
      run:
        shell: bash
        working-directory: .

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: false
          pub-cache: false

      - name: Get dependencies
        run: flutter pub get

      - name: Prepare ephemeral Android CI signing config
        id: android-signing
        run: |
          set -euo pipefail
          echo "::notice::Normal CI creates an ephemeral release-signed APK for clean-install smoke testing only. Production signing exists only in hydrion-release.yml."
          ci_store_password="$(openssl rand -base64 24)"
          ci_key_password="${ci_store_password}"
          ci_key_alias="hydrion-ci-release"
          echo "::add-mask::${ci_store_password}"
          echo "::add-mask::${ci_key_alias}"
          keytool -genkeypair \
            -v \
            -keystore android/hydrion-ci-release.jks \
            -storepass "${ci_store_password}" \
            -keypass "${ci_key_password}" \
            -alias "${ci_key_alias}" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 30 \
            -dname "CN=Hydrion CI,O=The 1807,C=US"
          cat > android/key.properties <<EOF
          storeFile=../hydrion-ci-release.jks
          storePassword=${ci_store_password}
          keyAlias=${ci_key_alias}
          keyPassword=${ci_key_password}
          EOF
          echo "release_signing_available=true" >> "${GITHUB_OUTPUT}"
          echo "release_signing_kind=ci-ephemeral" >> "${GITHUB_OUTPUT}"

      - name: Build signed release APK
        if: steps.android-signing.outputs.release_signing_available == 'true'
        run: bash tool/ci_run_android_build.sh release

      - name: Validate and stage signed release APK
        if: steps.android-signing.outputs.release_signing_available == 'true'
        env:
          SIGNING_KIND: ${{ steps.android-signing.outputs.release_signing_kind }}
        run: |
          set -euo pipefail
          apk_path="build/app/outputs/flutter-apk/app-release.apk"
          output_dir="${CI_ARTIFACTS_DIRECTORY}/android"
          mkdir -p "${output_dir}"
          args=(
            --apk "${apk_path}"
            --output-dir "${output_dir}"
            --signing-kind "${SIGNING_KIND}"
            --git-sha "${GITHUB_SHA}"
          )
          dart run tool/validate_android_release.dart "${args[@]}"

      - name: Generate Android size audit
        if: steps.android-signing.outputs.release_signing_available == 'true'
        run: |
          mkdir -p "${CI_ARTIFACTS_DIRECTORY}"
          dart run tool/android_size_audit.dart \
            --output "${CI_ARTIFACTS_DIRECTORY}/hydrion-android-size-audit.txt" \
            "${CI_ARTIFACTS_DIRECTORY}/android"

      - name: Upload signed release Android APK
        if: steps.android-signing.outputs.release_signing_available == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hydrion-android-${{ steps.android-signing.outputs.release_signing_kind }}-signed-release-apk-${{ github.run_number }}-${{ github.run_attempt }}
          path: ${{ env.CI_ARTIFACTS_DIRECTORY }}/android/
          if-no-files-found: error
          retention-days: 14

      - name: Upload release-build diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hydrion-android-release-diagnostics-${{ github.run_number }}-${{ github.run_attempt }}
          path: ${{ env.CI_ARTIFACTS_DIRECTORY }}/android-release/
          if-no-files-found: warn
          retention-days: 14

      - name: Record release-job final state
        if: always()
        run: timeout 2m bash tool/ci_disk_diagnostics.sh "Android release job final state"

      - name: Upload Android size audit
        if: steps.android-signing.outputs.release_signing_available == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hydrion-android-size-audit-${{ github.run_number }}-${{ github.run_attempt }}
          path: ${{ env.CI_ARTIFACTS_DIRECTORY }}/hydrion-android-size-audit.txt
          if-no-files-found: error
          retention-days: 14

  build-web:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.scope != 'apple' }}
    name: Build Web
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: quality-gate

    defaults:
      run:
        shell: bash
        working-directory: .

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: false
          pub-cache: ${{ github.event_name != 'pull_request' }}

      - name: Get dependencies
        run: flutter pub get

      - name: Build Flutter web
        run: flutter build web --release

      - name: Upload web build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hydrion-web-build-${{ github.run_number }}-${{ github.run_attempt }}
          path: build/web
          if-no-files-found: error
          retention-days: 14

  build-ios:
    name: Build iOS (simulator + unsigned release)
    runs-on: macos-14
    timeout-minutes: 90
    needs: quality-gate
    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8

    defaults:
      run:
        shell: bash
        working-directory: .

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: false
          pub-cache: ${{ github.event_name != 'pull_request' }}

      - name: Get dependencies
        run: flutter pub get --enforce-lockfile

      - name: Install CocoaPods dependencies
        working-directory: ios
        env:
          LANG: en_US.UTF-8
          LC_ALL: en_US.UTF-8
        run: pod install --deployment

      - name: Test Apple destination discovery
        run: python3 -W error::SyntaxWarning -m unittest discover -s tool/tests -p 'test_apple_simulator.py'

      - name: Ensure watchOS simulator runtime is installed
        timeout-minutes: 21
        run: |
          python3 - <<'PYTHON'
          import json, subprocess
          runtimes = json.loads(subprocess.check_output(
              ["xcrun", "simctl", "list", "runtimes", "--json"], timeout=60))["runtimes"]
          if not any(r.get("isAvailable") and ".watchOS-" in r["identifier"] for r in runtimes):
              version = subprocess.check_output(
                  ["xcrun", "--sdk", "watchsimulator", "--show-sdk-version"],
                  text=True, timeout=60).strip()
              subprocess.run(["xcodebuild", "-downloadPlatform", "watchOS",
                              "-buildVersion", version], check=True, timeout=1200)
          PYTHON

      - name: Record Apple runner capacity before simulator validation
        run: |
          mkdir -p build
          df -h . "$HOME" | tee build/apple-capacity-before.txt
          df -i . "$HOME" | tee -a build/apple-capacity-before.txt

      - name: Build and launch paired Apple simulator apps
        timeout-minutes: 60
        run: >-
          python3 tool/apple_simulator.py --create-pair --build-and-launch
          --pair-timeout 300
          --output build/apple-simulator-destination.json

      - name: Record Apple runner capacity after simulator validation
        if: always()
        run: |
          mkdir -p build
          df -h . "$HOME" | tee build/apple-capacity-after.txt
          df -i . "$HOME" | tee -a build/apple-capacity-after.txt

      - name: Upload Apple destination evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hydrion-apple-destination-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            build/apple-simulator-destination.json
            build/apple-simulator-destination.events.jsonl
            build/apple-capacity-*.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Build unsigned iOS release app
        run: flutter build ios --release --no-codesign

      - name: Verify HydrionWidgets extension is embedded and correctly configured
        run: |
          set -euo pipefail

          simulator_app="build/ios/iphonesimulator/Runner.app"
          release_app="build/ios/iphoneos/Runner.app"

          for app_path in "${simulator_app}" "${release_app}"; do
            echo "Checking ${app_path}"

            test -d "${app_path}" || {
              echo "::error::Expected app bundle not found at ${app_path}."
              exit 1
            }

            appex_path="${app_path}/PlugIns/HydrionWidgets.appex"
            test -d "${appex_path}" || {
              echo "::error::HydrionWidgets.appex is missing from ${app_path}/PlugIns. The widget extension is not being embedded — this is the exact class of defect that previously broke widget installs."
              exit 1
            }

            widget_plist="${appex_path}/Info.plist"
            app_plist="${app_path}/Info.plist"

            widget_bundle_id="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "${widget_plist}")"
            widget_executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "${widget_plist}")"
            widget_package_type="$(/usr/libexec/PlistBuddy -c 'Print :CFBundlePackageType' "${widget_plist}")"
            widget_extension_point="$(/usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' "${widget_plist}")"
            widget_short_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "${widget_plist}")"
            widget_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "${widget_plist}")"

            app_bundle_id="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "${app_plist}")"
            app_short_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "${app_plist}")"
            app_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "${app_plist}")"

            echo "  Host:      ${app_bundle_id} ${app_short_version} (${app_version})"
            echo "  Extension: ${widget_bundle_id} ${widget_short_version} (${widget_version})"

            [[ "${widget_bundle_id}" == "${app_bundle_id}.widgets" ]] || {
              echo "::error::Widget bundle identifier '${widget_bundle_id}' does not follow '${app_bundle_id}.widgets'."
              exit 1
            }
            [[ "${widget_executable}" == "HydrionWidgets" ]] || {
              echo "::error::Unexpected CFBundleExecutable '${widget_executable}'."
              exit 1
            }
            [[ "${widget_package_type}" == "XPC!" ]] || {
              echo "::error::Unexpected CFBundlePackageType '${widget_package_type}' for an app extension."
              exit 1
            }
            [[ "${widget_extension_point}" == "com.apple.widgetkit-extension" ]] || {
              echo "::error::Unexpected NSExtensionPointIdentifier '${widget_extension_point}'."
              exit 1
            }
            [[ "${widget_short_version}" == "${app_short_version}" ]] || {
              echo "::error::Widget marketing version (${widget_short_version}) does not match the host app (${app_short_version})."
              exit 1
            }
            [[ "${widget_version}" == "${app_version}" ]] || {
              echo "::error::Widget build number (${widget_version}) does not match the host app (${app_version})."
              exit 1
            }

            echo "  OK"
          done

      - name: Verify Runner and HydrionWidgets share the expected App Group
        run: |
          set -euo pipefail

          runner_groups="$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.application-groups' ios/Runner/Runner.entitlements)"
          widget_groups="$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.application-groups' ios/HydrionWidgets/HydrionWidgets.entitlements)"

          echo "Runner entitlements:"
          echo "${runner_groups}"
          echo "HydrionWidgets entitlements:"
          echo "${widget_groups}"

          echo "${runner_groups}" | grep -q "group.com.the1807.hydrion" || {
            echo "::error::Runner.entitlements does not declare group.com.the1807.hydrion."
            exit 1
          }
          echo "${widget_groups}" | grep -q "group.com.the1807.hydrion" || {
            echo "::error::HydrionWidgets.entitlements does not declare group.com.the1807.hydrion."
            exit 1
          }
          [[ "${runner_groups}" == "${widget_groups}" ]] || {
            echo "::error::Runner and HydrionWidgets entitlements declare different App Group sets."
            exit 1
          }

      - name: Package traceable unsigned iOS release build
        run: |
          set -euo pipefail
          app="build/ios/iphoneos/Runner.app"
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Info.plist")"
          build="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app/Info.plist")"
          bundle_id="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")"
          output_dir="${CI_ARTIFACTS_DIRECTORY}/ios"
          artifact="hydrion-${version}-${build}-ios-unsigned-release.app.zip"
          mkdir -p "$output_dir"
          ditto -c -k --keepParent "$app" "$output_dir/$artifact"
          digest="$(shasum -a 256 "$output_dir/$artifact" | awk '{print $1}')"
          printf '%s  %s\n' "$digest" "$artifact" > "$output_dir/$artifact.sha256"
          python3 - "$output_dir/$artifact.manifest.json" "$version" "$build" "$artifact" "$digest" "$bundle_id" "$GITHUB_SHA" <<'PY'
          import json, sys
          _, output, version, build, artifact, digest, bundle_id, git_sha = sys.argv
          manifest = {
              "product": "Hydrion",
              "version": version,
              "build": int(build),
              "git_sha": git_sha,
              "platform": "ios",
              "artifact": artifact,
              "sha256": digest,
              "bundle_id": bundle_id,
              "widget_bundle_id": f"{bundle_id}.widgets",
              "signing_kind": "unsigned",
              "build_type": "release",
          }
          with open(output, "w", encoding="utf-8") as stream:
              json.dump(manifest, stream, indent=2)
              stream.write("\n")
          PY

      - name: Upload unsigned iOS release build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hydrion-ios-unsigned-release-${{ github.run_number }}-${{ github.run_attempt }}
          path: ${{ env.CI_ARTIFACTS_DIRECTORY }}/ios/
          if-no-files-found: error
          retention-days: 14
