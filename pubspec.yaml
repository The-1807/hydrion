name: hydrion
description: Hydrion.ai - AI-powered hydration companion. Secure, privacy-first, multi-language.
version: 1.2.0+4
publish_to: "none"
developer: "The 1807"

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  intl: ^0.20.2
  provider: ^6.1.2
  shared_preferences: ^2.3.3
  yaml: ^3.1.2
  geolocator: ^14.0.2
  flutter_local_notifications: ^20.1.0
  timezone: ^0.10.1
  image_picker: ^1.2.2
  flutter_markdown_plus: ^1.0.9
  lottie: ^3.6.1
  home_widget: ^0.9.3
  pdf: ^3.11.3
  share_plus: ^10.1.4
  flutter_secure_storage: ^10.3.3
  path_provider: ^2.1.5
  sqlite3: ^3.5.2
  sqlite_async: ^0.14.5
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/icons/icon1807.jpg
    - assets/UI_BETA/
    - assets/UI_BETA/pride/
    - assets/images/challenges/
    - assets/buffer/Shark.json
    - assets/pfp_mascot/hydrion_mascot.jpg
    - assets/pfp_mascot/pfp/
    - assets/fonts/
    - config/
    - docs/Hydrion_Legal_Pack_Markdown/
  generate: true

platforms:
  android:
  ios:
  web:
  macos:
  windows:

hooks:
  user_defines:
    sqlite3:
      source: sqlcipher
