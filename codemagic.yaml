workflows:
  hydrion-validation:
    name: Hydrion Validation
    instance_type: linux_x2
    max_build_duration: 45
    environment:
      flutter: 3.44.8
      vars:
        CI_ARTIFACTS_DIRECTORY: codemagic-artifacts/validation
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: main
          include: true
          source: true
        - pattern: develop
          include: true
          source: true
        - pattern: apk-stabilization
          include: true
          source: true
    scripts:
      - name: Prepare artifact directory
        script: |
          mkdir -p "$CI_ARTIFACTS_DIRECTORY"
          version="$(sed -n 's/^version: \([^+]*\)+\(.*\)$/\1/p' pubspec.yaml)"
          build="$(sed -n 's/^version: \([^+]*\)+\(.*\)$/\2/p' pubspec.yaml)"
          echo "HYDRION_VERSION=$version" >> "$CM_ENV"
          echo "HYDRION_BUILD=$build" >> "$CM_ENV"
      - name: Record environment
        script: |
          {
            echo "Hydrion Codemagic validation"
            flutter --version
            dart --version
            java -version
          } 2>&1 | tee "$CI_ARTIFACTS_DIRECTORY/environment.txt"
      - name: Get dependencies
        script: flutter pub get 2>&1 | tee "$CI_ARTIFACTS_DIRECTORY/flutter-pub-get.log"
      - name: Verify formatting
        script: dart format --set-exit-if-changed . 2>&1 | tee "$CI_ARTIFACTS_DIRECTORY/dart-format.log"
      - name: Secret hygiene scan
        script: dart run tool/secret_scan.dart 2>&1 | tee "$CI_ARTIFACTS_DIRECTORY/secret-scan.log"
      - name: Analyze
        script: flutter analyze 2>&1 | tee "$CI_ARTIFACTS_DIRECTORY/flutter-analyze.log"
      - name: Test
        script: flutter test 2>&1 | tee "$CI_ARTIFACTS_DIRECTORY/flutter-test.log"
      - name: Build web release
        script: flutter build web --release 2>&1 | tee "$CI_ARTIFACTS_DIRECTORY/flutter-build-web.log"
    artifacts:
      - codemagic-artifacts/validation/**
      - build/web/**

  hydrion-android:
    name: Hydrion Android APK and App Bundle
    instance_type: linux_x2
    max_build_duration: 45
    environment:
      flutter: 3.44.8
      vars:
        CI_ARTIFACTS_DIRECTORY: codemagic-artifacts/android
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
        - pattern: develop
          include: true
          source: true
        - pattern: apk-stabilization
          include: true
          source: true
    scripts:
      - name: Prepare artifact directory
        script: |
          mkdir -p "$CI_ARTIFACTS_DIRECTORY"
          version="$(sed -n 's/^version: \([^+]*\)+\(.*\)$/\1/p' pubspec.yaml)"
          build="$(sed -n 's/^version: \([^+]*\)+\(.*\)$/\2/p' pubspec.yaml)"
          test -n "$version" && test -n "$build"
          echo "HYDRION_VERSION=$version" >> "$CM_ENV"
          echo "HYDRION_BUILD=$build" >> "$CM_ENV"
      - name: Get dependencies
        script: flutter pub get 2>&1 | tee "$CI_ARTIFACTS_DIRECTORY/flutter-pub-get.log"
      - name: Build debug smoke APK
        script: |
          flutter build apk --debug 2>&1 | tee "$CI_ARTIFACTS_DIRECTORY/flutter-build-debug-apk.log"
          cp build/app/outputs/flutter-apk/app-debug.apk \
            "$CI_ARTIFACTS_DIRECTORY/hydrion-android-debug-smoke.apk"
      - name: Prepare ephemeral Android CI signing
        script: |
          set -euo pipefail
          echo "HYDRION_ANDROID_SIGNING_KIND=ci-ephemeral" >> "$CM_ENV"
          echo "Creating an ephemeral CI keystore for clean-install smoke testing only."
          ci_store_password="$(openssl rand -base64 24)"
          ci_key_password="$(openssl rand -base64 24)"
          ci_key_alias="hydrion-ci-release"
          keytool -genkeypair \
            -v \
            -keystore android/hydrion-ci-release.jks \
            -storepass "$ci_store_password" \
            -keypass "$ci_key_password" \
            -alias "$ci_key_alias" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 30 \
            -dname "CN=Hydrion CI,O=The 1807,C=US"
          cat > android/key.properties <<EOF
          storeFile=../hydrion-ci-release.jks
          storePassword=$ci_store_password
          keyAlias=$ci_key_alias
          keyPassword=$ci_key_password
          EOF
      - name: Build signed release APK
        script: |
          flutter build apk --release 2>&1 | tee "$CI_ARTIFACTS_DIRECTORY/flutter-build-release-apk.log"
          args="--apk build/app/outputs/flutter-apk/app-release.apk --output-dir $CI_ARTIFACTS_DIRECTORY --signing-kind $HYDRION_ANDROID_SIGNING_KIND --git-sha $CM_COMMIT"
          dart run tool/validate_android_release.dart $args
      - name: Generate Android size audit
        script: |
          dart run tool/android_size_audit.dart \
            --output "$CI_ARTIFACTS_DIRECTORY/hydrion-android-size-audit.txt" \
            "$CI_ARTIFACTS_DIRECTORY" \
            2>&1 | tee "$CI_ARTIFACTS_DIRECTORY/android-size-audit.log"
    artifacts:
      - codemagic-artifacts/android/**

  hydrion-ios-compatibility:
    name: Hydrion iOS Compatibility
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: 3.44.8
      xcode: latest
      cocoapods: default
      vars:
        CI_ARTIFACTS_DIRECTORY: codemagic-artifacts/ios-compatibility
    scripts:
      - name: Prepare artifact directory
        script: mkdir -p "$CI_ARTIFACTS_DIRECTORY"
      - name: Get dependencies
        script: flutter pub get 2>&1 | tee "$CI_ARTIFACTS_DIRECTORY/flutter-pub-get.log"
      - name: Verify formatting
        script: dart format --set-exit-if-changed . 2>&1 | tee "$CI_ARTIFACTS_DIRECTORY/dart-format.log"
      - name: Secret hygiene scan
        script: dart run tool/secret_scan.dart 2>&1 | tee "$CI_ARTIFACTS_DIRECTORY/secret-scan.log"
      - name: Analyze
        script: flutter analyze 2>&1 | tee "$CI_ARTIFACTS_DIRECTORY/flutter-analyze.log"
      - name: Test
        script: flutter test 2>&1 | tee "$CI_ARTIFACTS_DIRECTORY/flutter-test.log"
      - name: Install CocoaPods
        script: |
          cd ios
          pod install 2>&1 | tee "../$CI_ARTIFACTS_DIRECTORY/pod-install.log"
      - name: Build iOS simulator target
        script: |
          flutter build ios --simulator --debug 2>&1 | tee "$CI_ARTIFACTS_DIRECTORY/flutter-build-ios-simulator.log"
          ditto -c -k --keepParent build/ios/iphonesimulator/Runner.app \
            "$CI_ARTIFACTS_DIRECTORY/hydrion-ios-simulator-compatibility.app.zip"
      - name: Build unsigned iOS release
        script: |
          flutter build ios --release --no-codesign 2>&1 | tee "$CI_ARTIFACTS_DIRECTORY/flutter-build-ios-release-nocodesign.log"
    artifacts:
      - codemagic-artifacts/ios-compatibility/**
      - build/ios/iphoneos/Runner.app/**

  hydrion-ios-signed-testflight-prep:
    name: Hydrion Signed iOS IPA and TestFlight Prep
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: 3.44.8
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.the1807.hydrion
      vars:
        BUNDLE_ID: com.the1807.hydrion
        WIDGET_BUNDLE_ID: com.the1807.hydrion.widgets
        CI_ARTIFACTS_DIRECTORY: codemagic-artifacts/ios-signed
    scripts:
      - name: Confirm signed iOS gate
        script: |
          if [ "${HYDRION_SIGNED_IOS_ENABLED:-false}" != "true" ]; then
            echo "Set HYDRION_SIGNED_IOS_ENABLED=true in a protected Codemagic environment to build a signed IPA."
            exit 1
          fi
      - name: Prepare artifact directory
        script: mkdir -p "$CI_ARTIFACTS_DIRECTORY"
      - name: Get dependencies
        script: flutter pub get 2>&1 | tee "$CI_ARTIFACTS_DIRECTORY/flutter-pub-get.log"
      - name: Install CocoaPods
        script: |
          cd ios
          pod install 2>&1 | tee "../$CI_ARTIFACTS_DIRECTORY/pod-install.log"
      - name: Set up iOS code signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
          app-store-connect fetch-signing-files "$WIDGET_BUNDLE_ID" --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Build signed IPA
        script: |
          flutter build ipa --release 2>&1 | tee "$CI_ARTIFACTS_DIRECTORY/flutter-build-ipa.log"
          ipa_path="$(find build/ios/ipa -name '*.ipa' -type f | head -n 1)"
          if [ -z "$ipa_path" ]; then
            echo "Signed IPA was not produced."
            exit 1
          fi
          cp "$ipa_path" "$CI_ARTIFACTS_DIRECTORY/hydrion-ios-production-signed-release.ipa"
      - name: Verify signed Runner and WidgetKit extension
        script: |
          set -euo pipefail
          verify_dir="$CI_ARTIFACTS_DIRECTORY/ipa-verification"
          mkdir -p "$verify_dir"
          unzip -q "$CI_ARTIFACTS_DIRECTORY/hydrion-ios-production-signed-release.ipa" -d "$verify_dir"
          app_path="$(find "$verify_dir/Payload" -maxdepth 1 -name '*.app' -type d | head -n 1)"
          widget_path="$app_path/PlugIns/HydrionWidgets.appex"
          test -d "$app_path" && test -d "$widget_path"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          codesign --verify --strict --verbose=2 "$widget_path"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app_path/Info.plist")" = "$BUNDLE_ID"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$widget_path/Info.plist")" = "$WIDGET_BUNDLE_ID"
          runner_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app_path/Info.plist")"
          widget_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$widget_path/Info.plist")"
          runner_build="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app_path/Info.plist")"
          widget_build="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$widget_path/Info.plist")"
          test "$runner_version" = "$widget_version"
          test "$runner_build" = "$widget_build"
          shasum -a 256 "$CI_ARTIFACTS_DIRECTORY/hydrion-ios-production-signed-release.ipa" > \
            "$CI_ARTIFACTS_DIRECTORY/hydrion-ios-production-signed-release.ipa.sha256"
      - name: Prepare TestFlight note
        script: |
          cat > "$CI_ARTIFACTS_DIRECTORY/TESTFLIGHT_PREP.txt" <<'EOF'
          Hydrion signed IPA is built for App Store Connect upload or TestFlight preparation.
          This workflow does not publish automatically.
          Owner must explicitly upload or add a Codemagic publishing block after approval.
          EOF
    artifacts:
      - codemagic-artifacts/ios-signed/**
      - build/ios/ipa/*.ipa
